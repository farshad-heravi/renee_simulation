x-gazebo-simulation: &simulation
  image: farshadnh/fnh_robotnik_sim:latest
  network_mode: host
  privileged: true
  # The newer `deploy.resources.reservations.devices` (CDI-style) injection
  # exposes the NVIDIA driver .so files but not the EGL vendor ICD JSON, so
  # glvnd never selects the NVIDIA EGL backend for GUI rendering. The legacy
  # `runtime: nvidia` hook path handles the graphics capability injection
  # completely (confirmed: `docker info` lists `nvidia` as a runtime).
  runtime: nvidia
  environment:
    ROS_DOMAIN_ID: 0
    DISPLAY: ${DISPLAY}
    GZ_VERSION: harmonic
    # gz-transport independently decides which interface to bind/join its
    # discovery multicast group on (separate from CycloneDDS, and separate
    # from the host's 224.0.0.0/4-via-lo route in setup_multicast_route.sh).
    # Left to auto-detect, it picks the wifi interface, while the host route
    # redirects outbound multicast onto loopback — the two never converge,
    # so gzserver and the GUI/bridge never discover each other's topics
    # (symptom: GUI window opens but stays blank, `gz topic -l` empty from
    # a second process). Pin it to loopback so it matches the host route.
    GZ_IP: 127.0.0.1
    ROBOT: rbvogui
    ROBOT_MODEL: rbvogui_plus
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    # CycloneDDS auto-selects a network interface for discovery, and it
    # may pick a bad one: nodes see each other's topic names but never
    # exchange data. Pin it to loopback and skip multicast entirely
    # since every node here runs on this one machine.
    CYCLONEDDS_URI: "<CycloneDDS><Domain><General><Interfaces><NetworkInterface name=\"lo\"/></Interfaces><AllowMulticast>false</AllowMulticast></General><Discovery><Peers><Peer address=\"127.0.0.1\"/></Peers></Discovery></Domain></CycloneDDS>"
    ROS2_CLI_DISABLE_DAEMON: 1
    RENEE_SRC_PATH: /fnh_pkgs/src/renee_simulation
    # This host's GPU is NVIDIA; Mesa's dri2/EGL path can't drive it through
    # a plain /dev/dri bind mount ("failed to create dri2 screen", driver
    # (null)). NVIDIA Container Toolkit injects the real vendor EGL/GL libraries
    # instead, gated by these two vars plus the device reservation below.
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  group_add:
    # GID of the host's `render` group, which owns /dev/dri/renderD12*.
    # This is assigned per-machine by the GPU driver install, not portable —
    # check with `getent group render` if GUI rendering breaks again.
    - "110"
  devices:
    - "/dev/dri:/dev/dri"
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /dev/input:/dev/input
  volumes:
    - tmp:/tmp
    - gz_fuel_cache:/home/robot/.gz/fuel
    - ./../..:/fnh_pkgs:rw
    - ./build_pkgs.sh:/build_pkgs.sh:ro
    - ./world_spawn_entrypoint.sh:/world_spawn_entrypoint.sh:ro
    - ./robot_spawn_entrypoint.sh:/robot_spawn_entrypoint.sh:ro
    - ./slam_entrypoint.sh:/slam_entrypoint.sh:ro
    - ./navigation_entrypoint.sh:/navigation_entrypoint.sh:ro
    - ./localization_entrypoint.sh:/localization_entrypoint.sh:ro
    - ./moveit_entrypoint.sh:/moveit_entrypoint.sh:ro
    #- ./explore_entrypoint.sh:/explore_entrypoint.sh:ro
    - ./bt_entrypoint.sh:/bt_entrypoint.sh:ro
    - ./demo_spawn.sh:/demo_spawn.sh:ro
    - ./scanning_entrypoint.sh:/scanning_entrypoint.sh:ro

x-healthcheck-defaults: &healthcheck_defaults
  interval: 5s
  # ROS 2 discovery and TF queries can take a little over five seconds under
  # Gazebo load.  A 5 s Docker timeout killed otherwise successful readiness
  # checks, marking dependencies unhealthy and preventing Nav2 from starting.
  timeout: 20s
  retries: 3

# All healthchecks shell out to renee_bringup_utils' wait_for_ros (built into
# /fnh_pkgs/install by the `builder` service).
services:
  fuel-cache-init:
    <<: *simulation
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/home/robot/.gz/fuel"]
    command: []
  world:
    <<: *simulation
    command: /world_spawn_entrypoint.sh
    depends_on:
      fuel-cache-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/fnh_pkgs/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "topic", "/clock", "--msg"]
      start_period: 240s
  spawn-robot:
    <<: *simulation
    command: /robot_spawn_entrypoint.sh
    depends_on:
      world:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/fnh_pkgs/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "controller", "/robot/controller_manager", "joint_trajectory_controller", "--state", "active"]
      start_period: 120s
  slam:
    <<: *simulation
    command: /slam_entrypoint.sh
    depends_on:
      spawn-robot:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/fnh_pkgs/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "tf", "robot_map", "robot_odom"]
      start_period: 60s
  navigation:
    <<: *simulation
    command: /navigation_entrypoint.sh
    depends_on:
      localization:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/fnh_pkgs/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "node", "/robot/bt_navigator"]
      start_period: 60s
  localization:
    <<: *simulation
    command: /localization_entrypoint.sh
    depends_on:
      spawn-robot:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/fnh_pkgs/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "tf", "robot_map", "robot_odom"]
      start_period: 60s
  # explore:
  #   <<: *simulation
  #   command: /explore_entrypoint.sh
  moveit:
    <<: *simulation
    command: /moveit_entrypoint.sh
    depends_on:
      spawn-robot:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/fnh_pkgs/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "action", "/robot/move_action"]
      start_period: 120s
  # joystick:
  #   <<: *simulation
  #   command: ros2 launch teleop_twist_joy teleop-launch.py config_filepath:=/fnh_pkgs/custom.config.yaml joy_vel:=/robot/robotnik_base_control/cmd_vel_unstamped
  bt:
    <<: *simulation
    command: /bt_entrypoint.sh
    depends_on:
      moveit:
        condition: service_healthy
      navigation:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/fnh_pkgs/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "topic", "/bt_task_status"]
      start_period: 30s
  builder:
    <<: *simulation
    command: /build_pkgs.sh
  ros_terminal:
    <<: *simulation
    command: bash
  demo:
    <<: *simulation
    command: /demo_spawn.sh
  scanning:
    <<: *simulation
    command: /scanning_entrypoint.sh
volumes:
  tmp:
  gz_fuel_cache: