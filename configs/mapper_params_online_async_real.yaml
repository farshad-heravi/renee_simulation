slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss # None

    # ROS Parameters
    odom_frame: robot_odom
    map_frame: robot_map
    base_frame: robot_base_footprint
    scan_topic: /robot/front_laser/scan
    use_map_saver: true
    mode: mapping #localization

    # Was unset (defaults to 1): confirmed live on 2026-09-16 that the
    # tf2_ros::MessageFilter this constructs was dropping ~0.7% of scans all
    # session ("discarding message because the queue is full"), continuously
    # and independent of CPU load, network drops, or the map publish cycle
    # (all checked directly and ruled out). Root cause: /tf and
    # /robot/front_laser/scan are bridged from ROS1 as two independently
    # scheduled topics, and a queue depth of 1 has zero tolerance for the
    # small relative jitter between them. Widened to absorb that jitter.
    scan_queue_size: 10

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    # Was 0.02 (50Hz), then 0.0 after the original dual-publisher bug (see
    # mapper_params_online_async.yaml, still shared with sim, for that fix's
    # history: enable_interactive_mode: true was creating a second, stuck
    # periodic broadcaster racing the real scan-triggered one). But on this
    # real-robot config, confirmed live on 2026-09-16 that with period 0.0
    # slam_toolbox never broadcasts robot_map->robot_odom at all from a
    # fresh map — not even after the robot moved 2m+ and the pose graph
    # visibly grew (/map itself kept updating throughout) — despite
    # enable_interactive_mode already being false, so the on-new-node-only
    # path this value was assumed to fall back on isn't firing in this
    # build/scenario. Since enable_interactive_mode: false already removes
    # the original bug's actual root cause, a small nonzero period is safe
    # here and gives a real, continuous map->odom broadcast again.
    transform_publish_period: 0.05
    map_update_interval: 2.0 # 2.0
    resolution: 0.1
    min_laser_range: 0.05
    max_laser_range: 10.0 #for rastering images
    minimum_time_interval: 0.2 # 0.2
    transform_timeout: 1.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    # Was true: spins up interactive-marker infrastructure for manually
    # dragging pose-graph corrections in RViz. Not used by either the sim
    # or real-robot pipeline (both are fully automated), and it was the
    # source of a real bug: /tf showed two distinct slam_toolbox publisher
    # endpoints from the same process — one a frozen/cached interactive
    # reference pose, one the live scan-matched estimate — racing each
    # other and making map->odom flip-flop between them (visible in RViz
    # as the front laser appearing to spin while the robot sat still).
    enable_interactive_mode: false

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1 # 0.5
    # Was 0.2 (shared with sim, where Gazebo odometry is ~exact between
    # scans). Confirmed on 2026-09-16 by SSHing into the robot
    # (~/connect_rover) and reading its own onboard mapping stack
    # (robot_bringup's mapping_2d component -> ROS1 gmapping,
    # config/robot_local_control/slam_gmapping.yaml): it re-anchors on
    # angularUpdate: 0.1 rad. Real wheel odometry drifts noticeably more
    # than sim during turns (wheel slip), so re-anchoring twice as often
    # here keeps less error to correct for between scan insertions.
    minimum_travel_heading: 0.1 # 0.2 in the shared sim config
    scan_buffer_size: 30 # 10
    scan_buffer_maximum_scan_distance: 10.0 # 10.0
    link_match_minimum_response_fine: 0.10 #0.1   - reject weak matches
    link_scan_maximum_distance: 1.0 # 1.5 - only link nearby scans
    loop_search_maximum_distance: 6.0 # 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10 # 10     # lower than default to catch loops faster
    loop_match_maximum_variance_coarse: 8.0
    loop_match_minimum_response_coarse: 0.3
    loop_match_minimum_response_fine: 0.4

    loop_match_search_size: 12

    # Correlation Parameters - Correlation Parameters
    # Was 0.5 (shared with sim). Confirmed on 2026-09-16 (real vs. sim
    # comparison, see minimum_travel_heading note above): slam_toolbox's
    # correlative scan matcher has no odometry noise model at all — it
    # deterministically searches a fixed window around wherever raw
    # odometry says the robot is, and confidently returns the best match
    # *inside that window* even when it's wrong. The robot's own onboard
    # gmapping instead models odometry uncertainty explicitly
    # (srr/srt/str/stt in slam_gmapping.yaml) and spreads 100 particles
    # accordingly, so it tolerates real wheel-slip error that a fixed
    # +/-0.5m window doesn't. Measured directly: the same physical spot
    # showed the mapped wall ~0.8-1.1m from where a live scan placed it
    # while this was still 0.5m, and the offset only shrank back to normal
    # (~0.1-0.4m) after happening to re-visit with enough overlap to
    # trigger a loop closure. Widening the search window gives the matcher
    # a real chance at finding the correct alignment the first time,
    # instead of relying on a later loop closure to fix it after the fact.
    correlation_search_space_dimension: 1.5 # 0.5 in the shared sim config
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 3.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5 # 0.5 - punish big pose corrections
    angle_variance_penalty: 0.5 # 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.5
    minimum_distance_penalty: 0.5 # 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.2
